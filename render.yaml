services:
  - type: web
    name: cistour-price-monitor
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALERT_EMAIL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: API_TOKEN
        generateValue: true
  - type: cron
    name: cistour-price-monitor-daily
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run daily
    schedule: "0 6,7 * * *"
    envVars:
      - key: ALERT_EMAIL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
